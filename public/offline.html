<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOCUS - Оффлайн</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 300;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    .retry-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .retry-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .features {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      text-align: left;
    }
    .feature {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }
    .feature-icon {
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Нет подключения к интернету</h1>
    <p>FOCUS работает в оффлайн режиме. Некоторые функции могут быть недоступны до восстановления связи.</p>

    <button class="retry-btn" onclick="window.location.reload()">
      Попробовать снова
    </button>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">💬</div>
        <span>Просмотр чатов</span>
      </div>
      <div class="feature">
        <div class="feature-icon">📝</div>
        <span>Черновики сообщений</span>
      </div>
      <div class="feature">
        <div class="feature">
        <div class="feature-icon">📁</div>
        <span>Сохраненные файлы</span>
      </div>
      <div class="feature">
        <div class="feature-icon">⚙️</div>
        <span>Настройки</span>
      </div>
    </div>
  </div>

  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', function() {
      window.location.reload();
    });

    // Check connection periodically
    setInterval(function() {
      if (navigator.onLine) {
        // Try to fetch a small resource to verify connection
        fetch('/favicon.ico', { method: 'HEAD', cache: 'no-cache' })
          .then(() => window.location.reload())
          .catch(() => {});
      }
    }, 30000); // Check every 30 seconds
  </script>
</body>
</html>
